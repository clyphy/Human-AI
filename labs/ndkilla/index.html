
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oceti-weave AIE-OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0b;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glow-teal {
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.5);
        }
        .glow-amber {
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }
        .weave-bg {
            background-image: radial-gradient(circle at 2px 2px, rgba(45, 212, 191, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .scanning-line {
            height: 2px;
            background: linear-gradient(to right, transparent, #2dd4bf, transparent);
            position: absolute;
            width: 100%;
            z-index: 50;
            animation: scan 4s linear infinite;
        }
        @keyframes scan {
            0% { top: -2%; }
            100% { top: 102%; }
        }
    </style>
<script type="importmap">
{

    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "d3": "https://esm.sh/d3@^7.9.0"
  }
}
</script>
</head>
<body class="weave-bg">
    <div id="root"></div>
</body>
</html>
